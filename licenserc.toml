[header]
path = "scripts/license-header.txt"

[files]
includes = [
    "*.swift",
    "*.pkl",
    "*.h",
    "*.cpp",
    "*.sh",
    "PklProject",
]

excludes = [
    # HawkEye v7 does not treat the required swift-tools-version declaration
    # as a preamble, so keep the manifest's existing header untouched.
    "Package.swift",
    "Tests/PklSwiftTests/Fixtures/**",
    "codegen/snippet-tests/**",
    "doc/**",
]

[git]
file_attrs = 'enable'
ignore = 'enable'

[props]
copyright_owner = "Apple Inc. and the Pkl project authors"

[[rules]]
extensions = ["swift"]
style_out = "line_block"
